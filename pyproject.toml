[project]
name = "wbjp"
version = "0.1.0"
description = "Webull証券 OpenAPI を用いた日本株の自動売買システム"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    # --- ブローカー ---
    # requires-python が >=3.8,<3.15 のため 3.15 へは上げられない
    "webull-openapi-python-sdk>=2.0.18",
    # --- データ ---
    "polars>=1.44.0",
    "pyarrow>=25.0.0",          # pl.from_pandas() / DuckDB 連携に必要
    "yfinance>=1.6.0",
    "duckdb>=1.5.0",
    # --- 永続化 ---
    # SQLite は標準ライブラリの sqlite3 を直接使う。単一プロセス・単一
    # ライターで ORM が解決する問題が無く、障害時に素の SQL で
    # 調べられることの方が重要なため。
    # --- 設定・秘匿情報 ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # .env を os.environ を汚さずに読むため直接使う（config.py 参照）。
    "python-dotenv>=1.0",
    "keyring>=25.0",
    # --- 運用 ---
    "structlog>=24.4",
    "typer>=0.15",
    "tenacity>=9.0",
    "backtrader>=1.9.78.123",
    "pandas>=2.2",
]

[project.scripts]
wbjp = "wbjp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "freezegun>=1.5",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wbjp"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # コメント・docstring・文字列は日本語で書くため、全角記号を
    # 「紛らわしい文字」として弾く規則は無効にする
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.14"
packages = ["wbjp"]
mypy_path = "src"
strict = true
# SDK は型情報を持たないため
[[tool.mypy.overrides]]
module = ["webull.*", "yfinance.*", "duckdb.*", "keyring.*", "backtrader.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not network'"  # 既定ではネットワークを使わない
filterwarnings = [
    # backtrader の docstring にある未エスケープの \* （こちらでは直せない）
    "ignore:.*invalid escape sequence.*:SyntaxWarning:backtrader.*",
]
markers = [
    "network: 外部ネットワークに接続するテスト（既定でスキップ）",
    "uat: Webull UAT 環境に接続するテスト",
]

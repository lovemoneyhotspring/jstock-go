# staticcheck の設定。`make lint` と CI（.github/workflows/ci.yml）が読む。
# "inherit" は既定の検査一式。そこから外すものだけを書く。

checks = ["inherit", "-ST1005"]

# ST1005（error strings should not be capitalized）を外す理由:
# このリポジトリのエラー文は日本語で、固有名詞から始まるものが多い
# （「Discord への送信に失敗」「立花証券API 電文の組み立てに失敗しました」）。
# 固有名詞は小文字にできないし、日本語に大文字小文字は無いので、この検査は
# 成り立たない。英語の検査を日本語の文面に当てても直しようがない。

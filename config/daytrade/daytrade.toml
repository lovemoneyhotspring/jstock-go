# デイトレ（jp_gap_fade）の設定。**秘密はここに書かない。**
#
# 使い方:  uv run daytrade plan            前夜: 母集団を作る（cron 20:30）
#          uv run daytrade open --live     9:00: 気配でギャップ下位 N 銘柄を寄付で買う
#          uv run daytrade close --live    15:20〜: 当日買った分を成行で売る
#          uv run daytrade backtest        アーカイブで同じ規則を検証する
#
# 根拠と数字は docs/research/2026-08-jp-daytrade-selection.md。

[capital]
enabled = true             # false で jp_gap_fade を止める（plan / open は何もしない。close は台帳の買いを売る）
max_capital = 2000000      # 円。1 日に使う上限。0 にするとスクリーニングはするが買わない（N = 0）
order_budget = 670000      # 1 注文の目安。N = max_capital ÷ order_budget（200 万なら 3）
max_positions = 10

[universe]
segments = ["prime"]       # prime / standard / growth
min_turnover = 100000000   # 売買代金 20 日中央値 ≥ 1 億円（上げるほど成績は落ちる）
turnover_days = 20
exclude_cap_terciles = 1   # 時価総額の下位 1/3 を外す
exclude_earnings_prev = true
exclude_earnings_today = true
exclude_margin_alert = true

[signal]
max_gap = 0.0              # ギャップがこれ未満（負）の銘柄だけ
min_gap = -1.0             # 下限なし（大きなギャップダウンが利益源）
skip_limit_down = true     # 気配がストップ安の銘柄は買わない（引けの売りが約定せず持ち越しになる）

[regime]
# 危険信号（docs/DAYTRADE.md「危険信号」）。毎朝すべて計算してログに残し、有効にしたものだけが取引を止める
iv_gate = 0.0              # 0 = 常時。18 にすると高ボラ局面だけ（DD 半分、稼働 5 割）
skip_months = [12]         # 12 月は 9 年中 7 年がマイナス（IS/OOS ともに休む方が良い）
drift_days = 20            # 市場の日中ドリフト（TOPIX 寄り→引け）の平均日数
# drift_gate = -0.0003     # ドリフトがこれ以下なら休む。2018/2021 は救うが 2022 年以降の利益を 3 割削るので既定は無効
drift_gap_override = 0.01  # 市場ギャップが ±1% を超える日はドリフトに関係なく取引（急落の寄付が最も効く）
equity_curve_days = 0      # 戦略の直近 N 日損益が 0 以下なら休む。0 で無効
# 前夜の米国: S&P500 が 0〜+1% の小幅高で VIX ≤ 24 の翌日は休む（東証のギャップダウンが個別要因になり逆張りが効かない）。
# 12 月休みと併用で 2017–2026 は合計 667 万・Sharpe 1.85・MaxDD −50 万、全年黒字（IS 1.62 / OOS 2.10）
us_skip_low = 0.0
us_skip_high = 0.01
us_vix_override = 24

[execution]
broker = "webull"
tax_account_type = "SPECIFIC"
quote_source = "webull"    # webull / yfinance / csv
entry_window = ["09:00", "09:15"]
exit_window = ["15:20", "15:30"]  # 15:20 の成行はその場で約定（引け値ではない）。15:25 以降ならクロージング・オークションで引け値
kill_switch = false
max_quote_age = 90

# デイトレ（jp_gap_fade）の設定。**秘密はここに書かない。**
#
# 使い方:  daytrade plan            前夜: 母集団を作る（cron 20:30）
#          daytrade open --live     9:00: 気配でギャップ下位 N 銘柄を寄付で買う
#          daytrade close --live    15:20〜: 当日買った分を成行で売る
#          daytrade backtest        アーカイブで同じ規則を検証する
#
# 根拠と数字は docs/research/2026-08-jp-daytrade-selection.md。

[capital]
enabled = true             # false で jp_gap_fade を止める（plan / open は何もしない。close は台帳の買いを売る）
max_capital = 2000000      # 円。1 日に使う上限。0 にするとスクリーニングはするが買わない（N = 0）
order_budget = 670000      # 1 注文の目安。N = max_capital ÷ order_budget（200 万なら 3）
max_positions = 10
weighting = "inverse_vol"  # N 銘柄への配分。equal（等金額）/ inverse_vol（20 日ボラの逆数。荒い銘柄を少なく）
max_order = 1000000        # 1 銘柄の上限（円、1 注文予算の 1.5 倍）。候補が N に満たない日に総予算を 1 銘柄に寄せない（0 で上限なし）

[universe]
segments = ["prime"]       # prime / standard / growth
min_turnover = 100000000   # 売買代金 20 日中央値 ≥ 1 億円（上げるほど成績は落ちる）
turnover_days = 20
exclude_cap_terciles = 1   # 時価総額の下位 1/3 を外す
exclude_earnings_prev = true
exclude_earnings_today = true
exclude_margin_alert = true
# 直近の本決算が赤字（当期純利益 ≤ 0）の銘柄を外す。赤字銘柄のギャップは個別の悪材料で戻らない
# （10 年 216 件・平均 −11.9 bp）。除外すると次点が繰り上がるので効果はそれより大きい:
#   信用版 10 年 2,093 → 2,162 万円・Sharpe 2.76 → 2.87・MaxDD −79 → −71 万円
#   IS（〜2022）1,272 → 1,305 万・2.67 → 2.74、OOS（2023〜）821 → 856 万・2.92 → 3.10（両半期とも改善）
#   現物版 713 → 766 万円・Sharpe 2.51 → 2.74・MaxDD −34 → −26 万円
# 本決算が見つからない銘柄（新規上場など）は落とさない。ショート側（[margin]）には入れていない
# ——売り側は益回りの 3 分位が単調でない。根拠は 2026-09-jp-value-signal。
exclude_loss = true

[signal]
# ギャップがこれ未満（負）の銘柄だけ。**0.0 のまま**——深い帯に絞ると 1 取引あたりの bp は倍に
# なるが（≤−5% で net +34.2 対 +16.8）、稼働日が半分に落ちて資金が遊ぶ。5 年の backtest では
# ロング 980 → 597（−0.03）→ 300 万円（−0.05）と大きく悪化する。研究ノート 2026-09-jp-open-time-gap
max_gap = 0.0
min_gap = -1.0             # 下限なし（大きなギャップダウンが利益源）
skip_limit_down = true     # 気配がストップ安の銘柄は買わない（引けの売りが約定せず持ち越しになる）
# 9:01 の時点で**既に寄っている**銘柄を候補から外す（ロング・ショートの両方に効く）。
# 利益源は特別気配で寄りが遅れる銘柄で、9:00 にすんなり寄る銘柄には戻りが無い（2 年で長短合わせて
# −13 万円）。しかも寄っている銘柄を 9:01 に成行で買うと最初の 1 分の反発ぶん平均 +27 bp 高く買う。
# 検証（分足、2024-11〜2026-09、9:01 建て・15:20 手仕舞い）: 合算 492 万 → 529 万、ショート 274 → 304 万。
#   daytrade backtest --config-dir config/daytrade_margin --since 2024-11-05 --fill-entry 09:01 --fill-exit 15:20
#
# **既定 false のまま。開けてはいけない（2026-09-11 に結論）。**
# 上の数字は「未寄付の銘柄を正しい順に並べられる」前提のもの。実際には未寄付の銘柄の値段は
# 板（最良気配）からしか取れず、板寄せ中の気配は真のギャップを**深いほど大きく圧縮する**
# （真の −7% → 観測 +2%、真の −4% → 観測 −2%）。この順位で未寄付だけを買うと net −1.7 bp で
# マイナスになる。寄済みも残して両方から選ぶのが最良（+7.6 bp、寄済みだけは +2.0 bp）。
# 495 営業日の実測: 研究ノート 2026-09-jp-open-time-gap。
skip_opened = false
# 候補の並べ方。gap … ギャップの小さい順（既定）／ gap_vol … ギャップ ÷ 20 日ボラの小さい順
# （1% しか動かない銘柄の −5% は、4% 動く銘柄の −5% より極端）。
# gap_vol は利益を変えずリスクを下げる: 10 年 Sharpe 2.52 → 2.78、探索・確認・分足の 4 窓すべてで
# 最大 DD が改善（分足のロング −68 → −37 万円）。等金額の検定では探索 +6.7 bp/日（t 2.1）・確認 +6.7 bp
# （t 1.7）で事前基準（t 2.5）には届かず、「リスク低減の設定」として採用。plan / evaluate で蓄積して見直す
# （docs/research/2026-09-jp-daytrade-selection-2.md）。
#
# **lgbm（2026-09-18〜）** … 候補・帯・N の取り方は gap_vol のまま、並べる順番だけを LightGBM の
# 予測値の高い順にする。特徴量は gap・gap_vol の鍵と順位・20 日ボラ・騰落率（1/4/19 本）・
# 20 日レンジ内の位置・前日の日中・売買代金・時価総額・株価・空売り残高・益回り・候補数（pkg/daytrade/rerank）。
# 9:01 の気配で並べて寄りで建てる形の模擬（498 日、流動性別コスト）で gap_vol +24.21 → lgbm +32.78 bp/日、
# 差 +8.58（t 1.96、20 シード全部で正、前半・後半とも正。空売り残高を公表済みの値に直した後の数字）。
# 事前登録の基準 1（t ≥ 2.0）には届かず、境目のまま採用した（2026-09-17 の判断）。1 シードでは t 0.62〜2.73。
# vault 20-research/2026-09-jp-daytrade-ml-open-quote.md。
# gap_vol の順位と「gap_vol なら選んだ銘柄」は history/ranking の rule_rank / rule_picked に毎日残る。
# 特徴量の無い古い plan を読んだ日は gap_vol で並べる（構造化ログ daytrade.rerank）。
# 学習し直すときは test/dt_lgbm_train.py（モデルと照合用データを同時に書く）。
# **backtest で lgbm を回すと学習期間（〜2026-09-16）と重なり、成績は割り引いて読む。**
# **平常日は gap_vol、米国小幅高の日だけ LightGBM**（2026-09-18〜）。学習期間の外・スプレッド込みで
# 測ると交互作用がはっきり出た（2024-09-02〜2026-09-18、500 日、建値 09:00・手仕舞い 15:20）:
#   小幅高だけ lgbm（この設定） 717 万円 / Sharpe 2.76 / DD −60.5 万
#   常時 lgbm（〜2026-09-18 の本番）  522 万円 / 2.32 / −66.4 万
#   gap_vol・小幅高は休む（旧本番）   601 万円 / 2.63 / −52.1 万
#   常時 gap_vol・小幅高も取引        435 万円 / 1.60 / −117.9 万
# gap_vol は小幅高の日に負け、LightGBM はその日に稼ぐ。逆に平常日は gap_vol が LightGBM に勝つ。
# **同じ 2 年で見つけた組み合わせなので、日次の差の検定はまだしていない**（journal 2026-09-18）。
#
# 2026-09-19 に常時 lgbm へ戻した。**寄る前の発注（preopen_legs）と組で決めた**——上の数字は
# 9:00:03 のザラ場成行の形のもので、そこでは lgbm が選ぶ銘柄の 65%（gap_vol は 34%）が
# 既に寄っており、板を食う 49.1 bp をほぼ全候補で払う。寄る前に出せばその滑りは掛からない。
# 滑りを除いた上限（全銘柄を始値で建てる）は lgbm +37.07 対 gap_vol +32.08 bp/日で lgbm が上。
# 今の実測（8:59:00 の気配の誤差込み）は lgbm +9.02 対 gap_vol +9.18 とほぼ同値で、差は
# 8:59 の気配の誤差が lgbm の優位（+5 bp）をちょうど食い潰した形。**8:59:45 の誤差は
# 8:59:00 より小さいはずで、それを測るのがこれから**（vault 2026-09-jp-daytrade-preopen-order）。
rank_by = "lgbm"
# rank_by が lgbm なので日による切り替えは要らない（空 = rank_by と同じ）。
rank_by_us_low = ""
# lgbm のモデル（このファイルからの相対パス）。
model = "models/lgbm_rank.txt"
# 2 段階選定: ギャップ順の上位 N × value_pool から益回り（直近本決算の純利益 ÷ 時価総額）の
# 高い順に N 銘柄。**検証したが採用しない（既定 0 = 無効）。**
# 横断では割安なほど強い（益回り 3 分位で 割高 +16.7 / 中位 +31.6 / 割安 +40.9 bp、差 +24.3・t 2.7）が、
# 選定に入れると利益源である深いギャップを捨てるので損益が落ちる（信用版 10 年）:
#   ×2 → 2,013 万（−3.8%）・Sharpe 2.85・MaxDD −61 万
#   ×3 → 1,816 万（−13.2%）・Sharpe 2.62・MaxDD −58 万
# 赤字除外と併用しても ×2 で 2,051 万（−2.0%）・Sharpe 2.91。DD を 2 割減らす道具としては効くので、
# 資金を増やして DD の絶対額が問題になったら再検討する。根拠は 2026-09-jp-value-signal。
# value_pool = 2
# 同じ日に同じ 33 業種を 2 銘柄以上建てない（1 = 1 業種 1 銘柄）。上限を超えた銘柄は落ちて
# 次点が繰り上がる——「外す」のではなく「入れ替える」ので取引日は減らない。
# 10 年（信用版）: 2,174 → 2,271 万（+4.5%）・Sharpe 2.88 → 3.08・MaxDD −71 → −56 万（−21%）。
# 直近 2 年の分足（9:01 建て・15:20 手仕舞い）: 594 → 620 万（+4.3%）・Sharpe 3.74 → 3.92・
# MaxDD −52 → −45 万。効果の大半は IS で、年別では 5 年が改善・5 年が悪化（合計は +97 万）。
# 業種が取れない銘柄は数に入れない（実機で業種が引けなくても今までどおりに落ちる）。
# 根拠は 2026-09-jp-sector-crowding。ショート脚（margin）には効かない。
max_per_sector = 1

[regime]
# 危険信号（docs/DAYTRADE.md「危険信号」）。毎朝すべて計算してログに残し、有効にしたものだけが取引を止める
iv_gate = 0.0              # 0 = 常時。18 にすると高ボラ局面だけ（DD 半分、稼働 5 割）
skip_months = [12]         # 12 月は 9 年中 7 年がマイナス（IS/OOS ともに休む方が良い）
drift_days = 20            # 市場の日中ドリフト（TOPIX 寄り→引け）の平均日数
# drift_gate = -0.0003     # ドリフトがこれ以下なら休む。2018/2021 は救うが 2022 年以降の利益を 3 割削るので既定は無効
drift_gap_override = 0.01  # 市場ギャップが ±1% を超える日はドリフトに関係なく取引（急落の寄付が最も効く）
equity_curve_days = 20     # 戦略の直近 N 日の実現損益が 0 以下なら資金を equity_curve_scale 倍に縮める。0 で無効
equity_curve_scale = 0.5   # 縮めた後の倍率（0 なら休む）。MaxDD −50 万 → −30 万、利益 −2%
# 前夜の米国: S&P500 が 0〜+1% の小幅高で VIX ≤ 24 の翌日は休む（東証のギャップダウンが個別要因になり逆張りが効かない）。
# 12 月休みと併用で 2017–2026 は合計 667 万・Sharpe 1.85・MaxDD −50 万、全年黒字（IS 1.62 / OOS 2.10）
us_skip_low = 0.0
us_skip_high = 0.01
us_vix_override = 24
# この休みを効かせる脚。"all" は両脚とも休む、"short" はショートだけ休みロングは取引する。
# 2026-09-18 から "short"。LightGBM で並べるロングはこの日も稼げる（5 年 405 日で +20.95 bp/日・t 3.79、
# 9:01 の気配の形でも +30.37）。gap_vol に対する優位はほぼこの日にある（休まない日の差は約 0）。
# ショートはこの日も +171 万（10 年）だが最大 DD が 75 → 107 万に増えるので休む。研究ノート 2026-09-jp-daytrade-ml-skip-days。
# rank_by を gap_vol に戻すときは "all" に戻す（gap_vol のこの日は +3.88 bp・t 0.59）。
# LightGBM で並べられない日（plan が古い・モデルが読めない・並べ替えに失敗）は open が自動で
# gap_vol と "all" に切り替える（ログ daytrade.rerank）
us_skip_legs = "short"
# 前夜の米国市場（us_skip_high / shock_us_ret の材料）がまだ取れていない回は 9:12 まで判定せずに待つ。
# open の cron は 9:00:03・9:00:25・9:01:03 と 9:03〜9:13 の 3 分おきなので、9:13 の回は取れた値で判定する（取れなければ異常に載せる）。
# FRED だけだった頃は火〜金の 9:01〜9:10 が前々夜の値で判定していた（前夜の値が出るのは 9:10 JST ごろ）
us_stale_wait_until = "09:12"
# ショック日（予期せぬ急落）: 9:00 の市場ギャップ（候補の中央値）か前夜の S&P500 がこれ以下の日。
# 予定された経済イベント（FOMC・日銀・雇用統計・選挙）には効きが無く、予定できないショックだけが効く。
# 市場ギャップ ≤ −2% の日は +7.8 万/日（10 年、t = 6.2、勝率 78%、IS/OOS 一致）で戦略の最良の日。
# 効くのはロング脚だけ（ショートの勝率 16〜26%）。根拠は docs/research/2026-09-jp-shock-days.md
shock_market_gap = -0.02
shock_us_ret = -0.02
# 倍率は現物（この設定）では 1 = 記録だけ。現金 200 万で 300 万は買えない。信用買いの
# config/daytrade_margin が 1.5 / 0 に上書きする（ロング ×1.5 でも建玉 450 万 < 通常の 500 万）
shock_long_scale = 1.0
shock_short_scale = 1.0

[book]
# 板・気配の記録（`daytrade snap`。docs/OPENING_DATA.md）。集めるだけで選定には使わない。
# 板は過去に遡れない（J-Quants の分足にもティックにも板は無い）ので、記録を始めた日から
# しか手に入らない。1 日止めれば 1 日ぶん永久に欠ける
enabled = true
scope = "all"    # all（plan の全行 = 全上場）/ universe（母集団だけ）。条件を将来変えられるよう all
# snap 1 回に許す秒数。open / close とロックを共有するので、遅い日にここで粘ると 9:01 の発注が
# ロックを取れずに消える。全上場でも正常なら 10 秒で終わる（31 リクエスト × 4 回/秒）
max_run_seconds = 50
# columns は時価問合で取りに行く列（sTargetColumn）。空なら始値・現在値・現在値時刻・前日終値。
# 応答に返った列は指定の有無にかかわらず全部記録するので、ここは「何を要求するか」だけ。
#
# 2026-09-11 に実機（本番）で確かめた列（`daytrade quotes --raw --columns ...` 7203）:
#   値段  pDOP 始値 / pDPP 現在値 / tDPP:T 現在値時刻 / pPRP 前日終値（基準値段）/ pDHP 高値 / pDLP 安値 / pVWAP
#   出来  pDV 出来高 / pDJ 売買代金
#   気配  pQAS・pQBS 気配種類（0101 など）/ pQAP・pQBP 最良売買気配値 / pAV・pBV その数量
#   板    pGAP1..10・pGAV1..10（売）、pGBP1..10・pGBV1..10（買）——**10 段とも値が返る**
#   総量  pQOV（OVER）/ pQUV（UNDER）
#   寄前  pIEP・pIEV・pIET（予想約定値段・数量・時刻）。引け後は空。板寄せ中に入るはずなので取る
#   特別  pSAV・pSBV。引け後は空
# pGAP0 / pGBP0 / pGAV0 / pGBV0 は空で返る（0 段は無い）。
# 列は後から足しても過去は埋まらないので、空で返るものも含めて広く取る（docs/OPENING_DATA.md の原則 2）
columns = "pDOP,pDPP,tDPP:T,pPRP,pDHP,pDLP,pDV,pDJ,pVWAP,pQAS,pQBS,pQAP,pQBP,pAV,pBV,pQOV,pQUV,pIEP,pIEV,pIET,pSAV,pSBV,pGAP1,pGAV1,pGBP1,pGBV1,pGAP2,pGAV2,pGBP2,pGBV2,pGAP3,pGAV3,pGBP3,pGBV3,pGAP4,pGAV4,pGBP4,pGBV4,pGAP5,pGAV5,pGBP5,pGBV5,pGAP6,pGAV6,pGBP6,pGBV6,pGAP7,pGAV7,pGBP7,pGBV7,pGAP8,pGAV8,pGBP8,pGBV8,pGAP9,pGAV9,pGBP9,pGBV9,pGAP10,pGAV10,pGBP10,pGBV10"

[execution]
broker = "tachibana"
tax_account_type = "SPECIFIC"
quote_source = "tachibana"   # tachibana / csv。立花証券の時価問合（寄付後は始値、無ければ現在値）
entry_window = ["08:59", "09:15"]
# 寄る前の回で**寄成**（執行条件「寄付」＝ sCondition 2）を出す脚。none / long / short / both。
# 寄成はその銘柄の始値を決める板寄せに参加するので、寄った後の値を追わず始値で建つ。
# none 以外にするなら entry_window の開始を 9:00 より前（8:59）にして、cron に 8:59:45 の回を足す
# ——窓が 9:00 開始のままだと寄る前の回が走らず、設定の検査で止まる。
# 9:00 以降の回は脚によらず従来どおりザラ場の成行（未寄付なら成行でも板寄せに入る）。
# 2026-09-19 から long。**事前登録の「8:59:45 の記録が 20 営業日」を待たずに開けた**
# （ユーザ判断。記録を溜めながら始値との誤差を測る）。ショートは margin.paused = true で
# 建てていないので long のまま——再開するときに both にするか決める。
# **立花の sCondition ≠ 0 は実機未検証**（docs/BROKER_VERIFY.md）。寄成が拒否されても
# 9:00:03 以降の回が従来のザラ場成行で残りの枚数を埋めるので、最悪でも今の形に戻る。
preopen_legs = "long"
exit_window = ["15:20", "15:30"]  # 15:20 の成行はその場で約定（引け値ではない）。15:25 以降ならクロージング・オークションで引け値
guard_window = ["09:00", "15:19"] # daytrade guard（材料の出た売建の取消・返済）。引けの手仕舞いと重ねない
kill_switch = false
max_quote_age = 90
# 1 回の open / close に許す秒数。開始からこれだけ経つか時間帯の終わりが来たら、その先の電文は
# 送らず送信中のものは打ち切る。ブローカーが遅い日に 1 回がロックを握り続け、次の cron（3 分後）
# まで潰すのを防ぐ。cron の間隔（180 秒）より短くする。締め切りで送れなかった注文は次の回が、
# 残りの枚数ぶんだけ建て直す。open の 9:00:25・9:01:03 の回は初回から 22 秒・60 秒しか空かないが、ここは縮めない
# ——遅いが進んでいる初回を打ち切るより、早い再試行がロック待ちで見送るほうが害が小さい
max_run_seconds = 150
# 成行が払うスプレッドの片道（bp）。**backtest と evaluate の費用にだけ効く。発注は変えない。**
# 成行買いは最良売気配、成行売りは最良買気配で約定するので、中値との差だけ必ず負ける。
# 建値・手仕舞い値に使う分足やティックは「約定値」なので中値の近くに来ており、この差が
# どの検証にも入っていなかった（研究ノート 2026-09-jp-daytrade-ml-entry-timing の限界 5）。
# 寄付のぶんは**既に寄っている銘柄にだけ**掛かる——未寄付は板寄せに参加して寄値で約定する。
# 実測: 板の記録（history/book、2026-09-11〜09-18 の 6 営業日）で 9:00:06〜08 のスプレッドは
# 全上場の中央 53.1 bp（片道 26.6）、ギャップ −3〜0% の寄済み銘柄で 61.7 bp（片道 30.8）。
# 15:19 は 21.7 bp（片道 10.8）で、朝の半分以下に狭い。6 営業日しかないので、溜まったら測り直す。
spread_bp_open = 27
spread_bp_close = 11

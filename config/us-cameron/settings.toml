# ロス・キャメロン流モメンタム（ross_cameron）の日足版。config/us と同じ銘柄。
#   uv run wbjp data sync --config-dir config/us-cameron --days 400
#   uv run wbjp screen   --config-dir config/us-cameron
#   uv run wbjp backtest --config-dir config/us-cameron --from 2019-01-01
[universe]
market = "US"
data_provider = "yfinance"
symbols_file = "universe.txt"
symbols = []

[risk]
kill_switch = false
max_order_value = "1000000"   # 等分では資産成長で 1 銘柄分が上限を超えると全買いが止まる罠があるため大きく
max_orders_per_day = 20
max_daily_loss = "100000"
max_position_weight = "0.25"
max_gross_exposure = "1.0"
max_preview_deviation = "0.02"

[sizing]
# 本家は「1 トレードの損失額を固定」して株数を決める（リスクベース）。
# 初期ストップ幅（stops.initial_stop_pct）が 1R になる。
method = "atr_risk"
risk_per_trade = "0.01"
atr_stop_multiple = "2.0"     # initial_stop_pct が優先されるため、ここは未使用
fixed_notional = "3000"
max_positions = 5

[stops]
# 本家の「損切りは押し目安値・利確は 2:1」を stops 側で再現する。
# ギャップ日の安値は終値から 3〜6% 下にあることが多いので -5% を初期値にする。
initial_stop_pct = "0.05"
# +1R で建値移動（負けをゼロにする）
breakeven_after_r = "1.0"
trailing = true
# +2R で半分を利確。残りは戦略側の EMA9 割れ（exit_on_ema）で降りる
take_profit_r = "2.0"
take_profit_fraction = "0.5"
# 本家は動かない株をすぐ切る。3 営業日で含み益なしなら手仕舞い
stale_exit_days = 3
max_hold_days = 15

[regime]
enabled = false

[execution]
order_type = "market"
extended_hours = false

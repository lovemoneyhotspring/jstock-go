# ロス・キャメロン流（Gap & Go ＋ マイクロプルバック）の日足版。
# 本家は分足のデイトレードなので、翻訳の対応表は
# src/wbjp/strategy/samples/ross_cameron.py の冒頭を参照。
combiner = "priority"
entry_threshold = 0.3
exit_threshold = 0.1

[[strategies]]
name = "ross_cameron"
enabled = true
weight = 10.0
# 材料日の定義。本家は小型株で「ギャップ 10%・RVOL 5x」だが、大型株ユニバースでは
# ほぼ出ないため緩めてある。締めるなら gap_min = 0.05, rvol_min = 3.0 あたりから
gap_min = 0.03
rvol_min = 2.0
close_strength = 0.7          # 終値がレンジの上位 30% 以内で引ける（ギャップを守った）
high_lookback = 20            # Gap & Go のブレイク判定に使う直近高値の日数
ema_fast = 9
ema_slow = 20
# 入口の種類
allow_gap_entry = true        # 材料日そのものに乗る
allow_pullback_entry = true   # 材料日のあと 1〜3 日の押し目からの再上昇に乗る
catalyst_lookback = 5
max_pullback_days = 3
# 共通フィルタ
min_atr_ratio = 0.015
max_atr_ratio = 0.10
min_dollar_volume = 5_000_000.0
# min_price = 2.0             # 本家の $2〜$20 帯。大型株では無意味なので無効
# max_price = 20.0
benchmark = "SPY"
benchmark_sma = 50
# 決算は本家にとって「材料」なので既定では避けない。避けるなら次を有効化
# blackout_file = "config/us-cameron/earnings.toml"
# blackout_days_before = 3
# 出口（損切り・2R 利確は settings.toml の [stops] 側）
exit_on_ema = true            # 終値 < EMA9 で降りる（本家の 9EMA トレーリング）
exit_on_prev_low = false      # 終値 < 前日安値で降りる（EMA9 より早い）

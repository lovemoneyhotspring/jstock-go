# 積立の設定。戦略と銘柄の対応。
#
# スイング売買（config/<dir>/settings.toml, strategies.toml）とは別プロジェクト。
# あちらは全戦略が意見を出して合成されるが、積立は銘柄ごとに戦略が1つ決まり、
# 予算 × 倍率で買い増すだけで売却しない。
#
#   uv run accum strategies   … 使える戦略
#   uv run accum list         … この対応表
#   uv run accum plan         … 今いくら買うか
#   uv run accum run --live   … 実際に発注（本番は WBJP_ENV=prod も必要）
#
# 命名の方針:
#   tactic … 機構の名前。登録簿の鍵。倍率などの数値は含めない
#   id     … 比較表の行名になる自由なラベル。日本語でよい
#   同じ tactic をパラメータ違いで何度でも並べられる。
#
# 1つの銘柄を複数の戦略に書くと二重買付になるため、既定でエラーになる。
# 比較検証したいときは load(allow_overlap=True) を使う。
#
# 発注時間帯（window）:
#   既定は 14:00〜15:00。省略すればこれが適用される。
#   window = false                          … 時間帯を制限しない
#   window = { start = "12:30", end = "13:00" } … 任意の時間帯（立会時間内のみ）
#   投下額は変わらない。日足で決まった金額を「いつ発注してよいか」だけを決める。
#   14時台を既定にしたのは安いからではなく、大引けに対するぶれが寄り付きの
#   約1/3だから。60分足3年の実測では時間帯による平均取得単価の差は ±0.03%。

# 1銘柄あたりの毎月の基本予算（既定値）。
# 個別の [[tactics]] に monthly_budget を書けば、その戦略（銘柄）だけこちらを使う
# （書かなければこの既定値のまま）。
monthly_budget = 25_000

# 緊急停止。true にすると `accum run --live` でも発注しない。
kill_switch = false

# 足データの取得元。登録済みの名前（jquants | fred）。判定用の指数は市場を
# またぐので、省略すると市場ごとの既定を使う: 日本株は J-Quants（公式 API、
# WBJP_JQUANTS_API_KEY が要る）、米国の指数（^GSPC / ^IXIC 等）は FRED（終値のみ）。
# 通常は書かない。
# data_provider = "jquants"

# 発注の振る舞い。積立は当日の投下額を成行の買いにする。
[execution]
# 発注先。登録済みのブローカー名（tachibana | paper）。paper はネットワークに繋がないシミュレータ。
broker = "tachibana"
# 注文種別。market（成行、既定）| limit（最新価格 × (1 + limit_offset) の指値）。
# ETF は板が薄いことがあるので、上限を切りたければ limit。
# 563A のような上場が浅く板の薄い ETF に 14 時台の成行を出すと、想定より高い約定を
# 掴みうる。指値なら上限が切れ、未約定（失効）なら差額として次のリリース日に埋まる。
order_type = "limit"
limit_offset = "0.01"
# 成行が「気配値が無い」で拒否されたら指値で出し直す（新規上場 ETF で実測）。
fallback_to_limit = true
# GENERAL（一般） / SPECIFIC（特定） / NISA
tax_account_type = "SPECIFIC"
# 売買単位が既定（100株）と異なる銘柄。ETF は 1 株・10 株単位のものが多い。
# 既定（100株）のままだと月の予算が1単元に届かず、発注が丸ごと見送りになる。
# 発注前にブローカーの銘柄情報（lot_size）で確かめ、分かった銘柄は API の値を優先する。
# ここに書くのは API で分からない銘柄（新規上場など）のための控え。
# 452A = 10 口、563A = 1 口（JPX で確認済み）
lot_size_overrides = { "452A.T" = 10, "563A.T" = 1, "1305.T" = 10, "1591.T" = 1, "1306.T" = 10 }


# market は足の取得と発注先に使う（既定 "JP"）。
#   JP … 1305.T → 足は 1305.T、発注は 1305      US … VOO はそのまま
# ^ で始まる指数（^GSPC など）は足は取れるが発注はできない（検証用）。
#
# signal_symbol を書くと、倍率の判定だけをその銘柄の足で行う（買うのは symbols）。
# 東証の S&P500 連動 ETF を、本家の指数 ^GSPC の配列で判定する、といった使い方。
# 暦が違っても（米国の判定値を東証の日に当てる）「その日以前で最新」の判定値を使う。
# 判定用の市場の引けが買う市場の判断時刻より後（東証を米国指数で判定）なら、
# 同じ日付の足はまだ無いので自動で前日の足を使う（バックテストもライブも同じ）。
# signal_market は判定用銘柄の市場（省略時は market と同じ）。
#
#   [[tactics]]
#   id = "452A（S&P500で判定）"
#   tactic = "bear_stack"
#   symbols = ["452A.T"]
#   market = "JP"
#   signal_symbol = "^GSPC"
#   signal_market = "US"
#   multiplier = 4
#   monthly_budget = 40_000        # この銘柄の毎月の基本予算（必須）

# 完全下降配列（終値 < MA20 < MA50 < MA200）で4倍。
# 追加投入1円あたりの効果が最良で、必要資金も最少（年平均1.15〜1.42倍）。
# 発動は全期間の5〜13%程度。増額の原資は賞与など新規資金を前提とする。
#
# 買う ETF は上場が浅く（452A は 2025-11、563A は 2026-04）自身の足では 200 日線が
# 揃わないため、判定は連動先の本家指数で行う。指数の引けは翌朝 JST なので、
# 同じ日付の足は使わず前日の足で判定する（自動）。
[[tactics]]
id = "452A 配列4倍（S&P500 で判定）"
tactic = "bear_stack"
symbols = ["452A.T"]            # iShares S&P500 プレミアムインカム ETF
market = "JP"
signal_symbol = "^GSPC"         # S&P 500 指数（ウォッチリストの SPX）
signal_market = "US"
multiplier = 4
monthly_budget = 25_000
enabled = false

[[tactics]]
id = "563A 配列4倍（NASDAQ で判定）"
tactic = "bear_stack"
symbols = ["563A.T"]            # Global X NASDAQ100 カバードコール ETF
market = "JP"
signal_symbol = "^IXIC"         # NASDAQ 総合指数（ウォッチリストの IXIC）
signal_market = "US"
multiplier = 4
monthly_budget = 20_000

[[tactics]]
id = "1629 配列4倍"
tactic = "bear_stack"
symbols = ["1629.T"]          
market = "JP"
multiplier = 4
monthly_budget = 20_000

# 以前の対象（1305 / 1591）。止めてあるが、戻すときは enabled を外す。
[[tactics]]
id = "配列4倍（旧: 1305/1591）"
tactic = "bear_stack"
symbols = ["1305.T", "1591.T"]
multiplier = 4
monthly_budget = 25_000
enabled = false

# 同じ機構の弱め版。暴落時に平常の4倍を出せない場合はこちら。
# 年平均1.05〜1.14倍で済み、10年窓の勝率はほぼ変わらない。
[[tactics]]
id = "配列2倍"
tactic = "bear_stack"
symbols = ["^N225"]
multiplier = 2
window = { start = "14:00", end = "15:00" }
monthly_budget = 25_000
enabled = false

# 弱気スコア（0〜6）で段階的に増額。効果は最大だが資金効率は落ちる。
[[tactics]]
id = "段階型"
tactic = "stack_ladder"
symbols = ["^GSPC"]
market = "US"
multipliers = { 3 = 1.5, 5 = 2.0, 6 = 4.0 }
monthly_budget = 25_000
enabled = false

# 高値からの下落率で増額。米国指数では強いが、新高値を作らない市場では
# 常時発動に近くなり破綻する（日経225 の全期間で +13%）。
# require_downtrend で 200日線割れを条件に加えると発動が絞られる。
[[tactics]]
id = "下落率型"
tactic = "drawdown_ladder"
symbols = ["^IXIC"]
market = "US"
levels = [0.10, 0.20, 0.30]
multipliers = [2.0, 3.0, 4.0]
require_downtrend = true
monthly_budget = 25_000
enabled = false

# 比較の基準。増額しない純粋なドル平均法。発注時間帯は既定の 14:00〜15:00 JST。
[[tactics]]
id = "基準"
tactic = "constant"
symbols = ["1306.T"]
monthly_budget = 25_000
enabled = false


# ---------------------------------------------------------------------------
# バスケット（複数銘柄への配分）
# ---------------------------------------------------------------------------
# 戦略が「1銘柄を何倍買うか」なのに対し、バスケットは「予算をどの銘柄に
# どう振るか」。monthly_budget はバスケット全体の予算。比率（weights）は
# 毎日その日に足のある銘柄の間で正規化される。
#
# 同じ資金の流れを benchmark に投じた場合と XIRR・最大DD で比べる。
# 足は `accum sync` で取る。

# 例: TOPIX 連動 ETF 70% ＋ 日経225 連動 ETF 30%。下落時増額（bear_stack ×2）を重ねる
[[baskets]]
id = "TOPIX70+日経30"
weights = { "1306.T" = 0.7, "1321.T" = 0.3 }
tactic = "bear_stack"
multiplier = 2
monthly_budget = 50_000
benchmark = "1306.T"
enabled = false

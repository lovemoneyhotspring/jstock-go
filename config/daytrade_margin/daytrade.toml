# デイトレ jp_gap_fade_margin の設定。**秘密はここに書かない。**
#
# jp_gap_fade（config/daytrade）に信用売り（ショート）の脚 jp_gap_up_short を足したもの。立花証券 e支店で
# 運用する前提（信用手数料 0 円・貸借銘柄の新規売り・日計り）。ロング側の規則は jp_gap_fade と同じ。
# ショート側は独立した母集団（margin 節の segments 等）で「決算なし × ギャップ +5% 以上」を寄付で売り、
# 大引で買い戻す（常時）。
#
# **ロング側の規則は書かない。** `extends` で config/daytrade を土台にし、ここには
# 違う項目（資金・[margin]・信用だからできるショック日の倍率）だけを書く。ロング側を直すときは config/daytrade を直せば
# こちらにも効く。ここに同じ項目を書くと、そちらが優先される（配列は丸ごと置き換え）。
#
# 使い方:  daytrade plan  --config-dir config/daytrade_margin
#          daytrade backtest --config-dir config/daytrade_margin
#
# 根拠と数字は docs/research/2026-09-jp-gap-up-short.md（ショート）と
# docs/research/2026-08-jp-daytrade-selection.md「信用売り（2026-09-01 追記）」（ロングの信用買い）。
# 発注側: open はロングを信用買い（long_via_margin）・ショートを信用新規売り、close は返済、verify は脚ごとに突き合わせる。
# 秘密は .env: TACHIBANA_<ENV>_AUTH_ID / _PRIVATE_KEY_FILE / _ORDER_PASSWORD（docs/DEPLOY.md）。

extends = "../daytrade"

[capital]
# ロング側の 1 日の建玉上限（円）。信用買いなので現金（200 万円 = 保証金）より大きくできる。
# 200 万 = 現行 jp_gap_fade と同じ DD、300 万 = Sharpe・DD% を保ったまま利益 +46%、400 万 = DD −41%。
# 保証金率 33% なので長短合計 600 万円まで（300 万 + ショート 200 万 = 500 万、保証金 165 万）。
# 2026-09-16 に 300 → 500 万（保証金の増加ぶん）。受入保証金 3,813,827 円の実測に対し
# 所要保証金は長短合計 700 万 × 33% = 231 万で 1.65 倍の余裕。ショック日（ロング ×1.5）でも
# 750 万 = 248 万で収まる。ショートは据え置き——候補が 0 銘柄 33.5% / 1 銘柄 29.2% で N3 が
# 埋まらず、増額すると候補 1 銘柄の日の 1 銘柄が 100 → 178 万と未検証領域に入るため
# （研究ノート 30-projects/daytrade-margin-sizing）。
max_capital = 5000000
order_budget = 1670000     # N = round(500 ÷ 167) = 3。1 注文は max_capital ÷ N = 166.7 万
max_order = 2500000        # 1 銘柄の上限（1 注文予算の 1.5 倍）。**成績には効いていない**——2026-09-16 の測定で
                           # 250 万・300 万・上限なしは 10 年の最大 DD が −1,120,227 円と 1 円まで一致した
                           # （研究ノート 2026-09-jp-daytrade-max-order）。0.24% の日に切ってはいるが額が小さく、
                           # 「inverse_vol の偏りを切る栓」としては働いていない。効かせたいなら 200 万以下。
                           # それでも 250 万を置くのは、上限なしと同値のまま 200 万以下の目減りを避けられるため。
                           # 損益は 150 → 250 万で単調に増えて 250 万で飽和する（10 年 2,739 → 3,309 万、+21%。
                           # 150→167 +9.0% / 167→200 +8.8% / 200→250 +1.9% / 250→300 +0.1%）。
                           # 150 万据え置きは order_budget 167 万を下回って毎日張り付くが、結果は「壊れる」ではなく
                           # 「小さく回る」（損益 −17%、Sharpe 2.95 → 2.90）。下げない理由は Sharpe が下がるから
# 規則 R（2026-09-25〜）: 業種上限後の gap_vol 順に、1 銘柄 min(売買代金 20 日中央値 × 0.2%, 総額 ÷ 7) を
# 順位の上から割り当て、総額を使い切ったら止める（余りは現金）。N は資金で動かさず max_positions。
# 本番の形（気配の誤差・休み・ショック日）で資金 3,000 万の年率が N=3 の 1% → 16%、今の規模でも負けない。
# 研究は 20 位までだが max_positions = 12 で止める: 注文の送信は 2 回/秒（broker.orderLimiter）で、
# 寄成（8:59:53 開始、注文は約 1 秒後から）が 9:00 までに送れるのは 12 本まで（54.0 + (n−2)×0.5 秒）。
# 資金 700 万では 1 日の銘柄数は中央値 9・99% 点 12 で、13 銘柄以上の日は 0.3%（止めて使えない資金は平均 0.02%）
# ÷ 7 は 1 銘柄が総額の 14% まで（÷ 5〜÷ 9 は差が無く、集中を避ける好みで選んだ）。
# 研究ノート 20-research/2026-09-jp-daytrade-nscale.md。上の max_capital は保証金が読めない朝の値
# （[margin] capacity_ratio が毎朝の建可能額から決め直す）。max_order は規則 R では総額 ÷ 7 が先に効く
weighting = "turnover"
turnover_ratio = 0.002
name_divisor = 7
max_positions = 12

# [signal]（rank_by = lgbm とモデルを含む）は土台 config/daytrade をそのまま継ぐ。
# ロングの規則は土台と子で同一であること（config_test の TestMarginConfigMatchesBaseLongRules）。

# [regime] の equity_curve_days / equity_curve_scale は土台と同じ値。ここでは
# 「ロング側の直近 20 日損益 ≤ 0 が地合いが弱い合図」として読む。ショートは常時なので
# 記録のみ。margin.long_shrink = false のときロングには効かない。
[regime]
# ショック日（土台の shock_market_gap / shock_us_ret）はロングを 1.5 倍、ショートを建てない。
# 10 年: 合算 1,649 → 1,813 万・Sharpe 2.09 → 2.19、MaxDD 不変（max_order と併せて 2.38）。
# ×2 は 1,982 万 / 2.21 だが建玉 600 万 → 保証金が現金の 99% で余裕が無い。×1.5 なら
# 建玉 450 万で通常の 500 万を超えず、保証金は 82% のまま。研究ノート 2026-09-jp-shock-days
shock_long_scale = 1.5
shock_short_scale = 0.0

[margin]
enabled = true
cash = 2000000             # 保証金として差し入れる現金（円）。年率・DD はこれに対して見る
# 長短合計の上限を毎朝の信用新規建可能額から決め直す（上げ下げ両方。2026-09-25〜）。
# 平日 68%・ショック日（ロング ×1.5 の後）77%（= 1 ÷ 1.3、従来の安全率）・天井 1,000 万。
# 天井は本番の滑りを測るまでの栓（20-research/2026-09-jp-daytrade-margin-80pct-compound。60 件で 1,500 万を判断）。
# ショートは下の max_capital が上限のまま先に取り、残りがロング。使わなかったショートの枠は spill_to_long でロングへ
capacity_ratio = 0.68
shock_capacity_ratio = 0.77
capacity_ceiling = 10000000
max_capital = 2000000      # ショート側の 1 日の上限（円）。倍率 1.0 のときの建玉金額
order_budget = 670000      # ロングと同額（1 注文が小さいと滑りの bp 負担が上がる）
max_positions = 10
weighting = "inverse_vol"
# ショート専用の母集団（ロングの [universe] とは別。研究ノート 2026-09-jp-gap-up-short）
segments = ["prime"]       # プライムは張り付き（引けストップ高で返済できない）率 2.1%。全区分だと利益は増えるが OOS が崩れる
min_turnover = 100000000   # 上げるほど悪くなる（3 億で Sharpe 1.44）
exclude_cap_terciles = 0   # 小型に効きが厚い。外さない
exclude_earnings_prev = true   # 決算翌日のギャップアップは順張り（−30 bp/取引）
exclude_earnings_today = true
exclude_margin_alert = false   # 日々公表・注意喚起・増担保は外さない（建てられる規制銘柄に効きの差は無い）
exclude_jsf_stop = true        # 売り禁（日証金 申込停止）は新規売りが出せない
# TOB・MBO・締め出し・上場廃止の開示が出た銘柄は外す（買付価格に張り付き返済できない。2026-09-15 の 8848）。
# 判定は open の時点のニュースの記録簿（TDnet 適時開示の見出し）。検証では効かない
exclude_corp_events = true
corp_event_lookback_days = 120          # TOB の公表から締め出しの開示まで 49〜84 日の例がある
corp_event_max_staleness_minutes = 90   # 最後の取り込み（8:52）がこれより古ければショートを見送る
# 場中（daytrade guard、10 分おき）に材料の出た今日の売建を処置する。未約定なら取消、
# 一部約定なら残りを取消して約定分を返済買い、全部約定なら返済買い
cancel_on_corp_event = true
min_gap = 0.05             # ギャップ +5% 以上だけ、大きい順。5〜7% は +29 bp/取引、7〜10% +79、10% 以上 +112〜304
max_gap = 1.0
skip_limit_up = true       # 寄付がストップ高の銘柄は売らない
# 常時建てる（通常日 1.0 / ロングが弱い日 1.0）。弱い日限定は Sharpe 2.94 だが稼働が 606 日に減る
multiplier_normal = 1.0
multiplier_long_weak = 1.0
# ロングは縮めない（jp_gap_fade の DD 抑制を外した経緯は研究ノート「ロングの DD 抑制を外す」）
long_shrink = false
# 1 注文の上限（円）。0 なら候補が N に満たない日は総予算 200 万を残った銘柄で分け合う。
# ショートは候補が中央値 2 銘柄/日で、候補 1 銘柄の日は 200 万が 1 銘柄に乗る——10 年の
# 最悪 20 取引のうち 13 件がこの日で、ショートの尻尾の実体。100 万で頭打ちにすると
# ショート 509 → 428 万（−16%）、Sharpe 0.87 → 1.03、MaxDD −117 → −75 万（分足 2 年でも同じ向き）。
# 67 万は −35%、134 万は DD −22% で、100 万が Sharpe の頂点。研究ノート 2026-09-jp-shock-days
max_order = 1000000
# ショートで使わなかった資金（候補 0 の日の 200 万、上限で頭打ちにした残り）をその日のロングに回す。
# ロングの銘柄数は総予算 ÷ 100 万（capital.max_positions = 10 が上限）で、長短の合計は 500 万のまま
# なので保証金は変わらない。10 年: 合算 1,734 → 2,110 万（+22%）、Sharpe 2.38 → 2.52、MaxDD 不変。
# 2 年（分足）: 442 → 541 万、Sharpe 2.90 → 3.18。上限なしで回すとロングの DD が −142 万に膨らむ——
# **max_order と組み合わせて初めて効く**。研究ノート 2026-09-jp-shock-days
spill_to_long = true
# ショートの一時停止（2026-09-18〜）。建てずに、枠（200 万）を毎日ロングへ回す（米国小幅高の日も。
# ショック日は従来どおり回さない）。9:00 以降の特別気配は +5% 以上のギャップを平均 −6.9pt 潰すので、
# 9:00:03 の気配で選ぶショートは 2 年の模擬で平均が負（−11.4 bp/日、t −0.94）。止めて 4 銘柄にすると
# 年 +201 → +245 万・最大 DD −118 → −81 万（t 1.37、事前登録なしの試算）。
# 研究ノート 2026-09-jp-daytrade-preopen-order。**寄る前（8:59:45）のショートを 20 営業日の記録で
# 測り直したら外す**（外すときは false に戻すだけ）
paused = true
# 往復コスト（bp）。信用手数料 0 円 + 貸株料（年 1.15%、日計り 1 日分 ≈ 0.3 bp）+ 滑り 5 bp の見込み。
extra_cost_bp = 5.3
# ロングも信用買い（日計り）で建てる。手数料 0 円、金利 年 2.50% の 1 日分 ≈ 0.7 bp + 滑り 5 bp
long_via_margin = true
long_extra_cost_bp = 5.7
# 検証のみ: 引けが制限値幅に張り付いた取引（売建のストップ高・買建のストップ安）を「翌営業日の寄付で手仕舞い」として計上する係数（1 = 全額、0 = 無視）。
# 実態は 0〜1 の間で、運用で約定率を測って決める。プライム限定なら 1.0 でも負け年 0（研究ノート）
carry_penalty = 1.0

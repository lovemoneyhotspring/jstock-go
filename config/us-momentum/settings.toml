# wbjp の設定 — 米国株・モメンタム順位戦略。**秘密はここに書かない。**
#
# 使い方:  uv run wbjp data sync --config-dir config/us-momentum
#          uv run wbjp screen    --config-dir config/us-momentum
#          uv run wbjp backtest  --config-dir config/us-momentum --from 2024-01-01
#
# 押し目買い（config/us）とは別プロセスで動かす。銘柄リストは共有。
# 損益比型の戦略なので、出口は「広い損切り」と「トレンド崩れ・順位脱落」だけ。
# 時間切れ・建値移動・利確は使わない（勝ちを伸ばすため）。

[universe]
market = "US"
data_provider = "yfinance"
symbols_file = "../us/universe.txt"
symbols = []

[risk]
kill_switch = false
# 等分・フル投資の戦略では、資産が増えると 1 銘柄分がこの上限を超えて
# **全部の買いが弾かれ、現金のまま止まる**（12年のバックテストで実際に起きた）。
# 資産規模に対して十分大きく取る。事故防止の役目は max_position_weight が担う。
max_order_value = "100000"
max_orders_per_day = 20
max_daily_loss = "1500"
max_position_weight = "0.25"
max_gross_exposure = "0.95"
max_preview_deviation = "0.02"

[sizing]
method = "atr_risk"
risk_per_trade = "0.01"
# 初期ストップ = 3×ATR。押し目買い（1.5）の倍。モメンタム銘柄の日々の
# ノイズで刈られないための幅。1% リスク ÷ 3ATR（≈6〜9%）≈ 資産の 12〜15%/銘柄
atr_stop_multiple = "3.0"
fixed_notional = "5000"
max_positions = 5

[stops]
# 広い ATR トレーリングだけ。上げるだけで下げない
trailing = true
# 以下はすべて無効（勝ちを伸ばす設計。手仕舞いは戦略側の判断に任せる）
# breakeven_after_r / take_profit_r / stale_exit_days / max_hold_days / trend_exit_sma

[execution]
tax_account_type = "SPECIFIC"
order_type = "limit"
limit_offset = "0.005"
stop_mode = "auto"
extended_hours = false

# 収集専用の設定。売買はしない。
#
# 将来売買する可能性のある銘柄の足を、細かい間隔で蓄積し続けるための設定。
# strategies.toml を置かないので `wbjp run` は使わない（戦略が無くても建玉の
# ストップ判定まで進むため）。使うのは `wbjp data sync` と `wbjp data status` だけ。
#
#   uv run wbjp data sync   --config-dir config/collect --days 7
#   uv run wbjp data status --config-dir config/collect --interval 1m
#
# cron（1分足は 7 日しか遡れない。取りこぼしに備えて 1 日 2 回）:
#   CRON_TZ=Asia/Tokyo
#   0 12,16 * * 1-5 cd /opt/wbjp && /opt/wbjp/.venv/bin/wbjp data sync --config-dir config/collect --days 7
#
# 取得元は data_provider で切り替える。基準足（1分足）に対応しない取得元でも、
# 日足は必ず揃える。日中足の無い期間は読み出すときに日足から見立てて補う。
#
# 市場は 1 設定 1 市場。米国株を集めるなら config/collect-us/ を別に作る。
[universe]
market = "JP"
data_provider = "yfinance"    # 日中足が要るので yfinance（jquants は日足のみ）
interval = "5m"          # 直接取る日中足。1分足と日足はこれとは別に必ず取る
base_interval = "1m"     # 蓄積の基準。ここから粗い足を合成する
symbols_file = "universe.txt"
symbols = []

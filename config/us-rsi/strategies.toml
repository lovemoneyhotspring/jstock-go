# 元版の押し目買い（RSI(3) 押し目、勝率 90% の入口）を復元した rsi_pullback。
# 出口の検証用ディレクトリ。入口は L2（研究記録 §2.3）に合わせ、RSI<30・反転確認なし。
combiner = "priority"
entry_threshold = 0.3
exit_threshold = 0.1

[[strategies]]
name = "rsi_pullback"
enabled = true
weight = 10.0
sma_long = 200
sma_mid = 50
sma_short = 20
slope_lookback = 20
rsi_period = 3
rsi_entry = 20.0
rsi_exit = 80.0
high_lookback = 60
max_drawdown_from_high = 0.15
min_atr_ratio = 0.015
max_atr_ratio = 0.05
min_dollar_volume = 5_000_000.0
require_reversal_bar = false
benchmark = "SPY"
benchmark_sma = 200
blackout_file = "config/us-rsi/earnings.toml"
blackout_days_before = 3
exit_before_earnings = false
# 戦略側の手仕舞い（出口の検証では stops 側に任せるため既定で無効）
exit_on_rsi = false
exit_on_high = false
exit_on_sma_recovery = false

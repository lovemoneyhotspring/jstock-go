# 戦略の有効化・重み・パラメータ。
#
# 各戦略は「買え/売れ」ではなく -1.0〜+1.0 の意見を返す。
# それを combiner が1本に合成し、サイジングが株数に変換する。
# 使える戦略は `wbjp strategies` で一覧できる。
#
# 積立はここには書かない。別プロジェクト（config/accum/accum.toml、`accum`）。

# 合成方式:
#   weighted_vote … 重み付き平均。少数意見も一定量は反映される（既定）
#   majority      … 過半数が同じ向きなら採用。割れたら見送る
#   veto          … 全員一致のときだけ動く。最も保守的
#   priority      … 重みが最大の戦略の意見をそのまま採る
combiner = "weighted_vote"

# 合成後の強さがこれ以上なら新規に建てる
entry_threshold = 0.3
# 保有中の銘柄がこれを下回ったら手仕舞う。
# entry と分けるのは、閾値付近で売買を繰り返して手数料に削られるのを
# 防ぐため（ヒステリシス）。
exit_threshold = 0.1


# 順張り。トレンドが続く相場で強く、横ばいでは往復ビンタを食らう。
[[strategies]]
name = "sma_cross"
enabled = true
weight = 1.0
fast = 25
slow = 75

# 逆張り。レンジで機能する。ADX が max_adx を超える強トレンド時は
# 自ら黙るので、sma_cross と正面衝突しにくい。
[[strategies]]
name = "rsi_reversion"
enabled = true
weight = 1.0
period = 14
oversold = 30.0
overbought = 70.0
max_adx = 40.0

# ブレイクアウト。勝率は低いが、大きな相場の初動を取りにいく。
[[strategies]]
name = "atr_breakout"
enabled = true
weight = 1.5
channel = 20
atr_period = 14
min_atr_ratio = 0.005

# 信用需給（信用倍率＝買残 ÷ 売残 の銘柄横断分位）。売り長（下位 20%）の買いを打ち消す。
# 根拠と限界は docs/research/2026-09-jp-margin-sentiment.md。効果は 20 日で +0.1% 程度の
# 小さな順位付け要因で、単独で勝てる戦略ではない。分位はユニバース内で取るので、
# 銘柄が 5 つしか無いこの設定では「常に 1 銘柄を弾く」だけになる——50 銘柄以上で使う。
# 信用残は J-Quants アーカイブ（markets/margin-interest、jquants sync が週次で更新）から読む。
# weighted_vote で打ち消すには他の戦略の重みの合計以上の重みが要る。
[[strategies]]
name = "margin_balance"
enabled = false
weight = 10.0
mode = "filter"        # filter … 売り長を弾くだけ / tilt … 買い長（上位 20%）に買い意見も出す
avoid_below = 0.2

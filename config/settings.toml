# wbjp の設定。**秘密はここに書かない。**
# APIキーは OS のキーチェーンに入れる: uv run wbjp credentials set --env uat

# --------------------------------------------------------------------------
# 売買対象
# --------------------------------------------------------------------------
# symbols は allowlist としても働く。ここに無い銘柄には、戦略が何を
# 言おうと絶対に発注されない。戦略のバグに対する最後の防波堤。
[universe]
# 取引市場。"JP"（東証）か "US"（NYSE/NASDAQ）。米国株の設定例は config/us/ を参照。
# 1つの設定ディレクトリは1つの市場だけを扱う。
market = "JP"

symbols = [
    "7203",  # トヨタ自動車
    "6758",  # ソニーグループ
    "9984",  # ソフトバンクグループ
    "8306",  # 三菱UFJフィナンシャル・グループ
    "6861",  # キーエンス
]

# TOPIX500 構成銘柄は呼値が細かい（1,000円以下なら 0.1円刻み）。
# ここに入れ忘れると、指値が呼値に乗らず注文が弾かれることがある。
topix500_symbols = ["7203", "6758", "9984", "8306", "6861"]

# 売買単位が100株でない銘柄だけ書く（ETF や REIT に1株単位のものがある）
# lot_size_overrides = { "1234" = 1 }

# --------------------------------------------------------------------------
# リスク上限 — すべての発注はここを通る
# --------------------------------------------------------------------------
[risk]
# 緊急停止。true にすると即座に全発注を止める。
# 異常に気付いたら、まずこれを true にする。
kill_switch = false

# 金額は口座通貨建て（JP なら円、US ならドル）。
max_order_value = "500000"        # 1注文あたりの上限
max_orders_per_day = 20           # 1日あたりの発注件数
max_daily_loss = "100000"         # 当日の損失がこれを超えたら新規建てを止める
max_position_weight = "0.25"      # 1銘柄が総資産に占める上限
max_gross_exposure = "0.90"       # 建玉合計の上限
max_preview_deviation = "0.02"    # ブローカー見積りと自前計算の許容乖離

# --------------------------------------------------------------------------
# ポジションサイジング
# --------------------------------------------------------------------------
[sizing]
# atr_risk     … 1トレードの損失額を揃える（推奨）
# equal_weight … 総資産を max_positions で等分
# fixed_notional … 1銘柄あたり固定金額
method = "atr_risk"

risk_per_trade = "0.01"      # 1トレードの許容損失（総資産比）
atr_stop_multiple = "2.0"    # 損切り幅 = ATR × この倍率
fixed_notional = "300000"
max_positions = 5

# --------------------------------------------------------------------------
# 発注の振る舞い
# --------------------------------------------------------------------------
[execution]
# 発注先。登録済みのブローカー名（webull | paper）。paper はネットワークに繋がないシミュレータ。
# 取引所を足すには wbcore.broker.base.Broker を継承して registry に登録する。
broker = "webull"

# GENERAL（一般） / SPECIFIC（特定） / NISA
tax_account_type = "SPECIFIC"

# 日本株は成行(market)と指値(limit)のみ。逆指値は API 非対応のため、
# 損切りはエンジン側で合成する（wbjp.risk.stops を参照）。
order_type = "limit"

# 指値を直近終値からどれだけずらすか。約定しやすい方向にずらす。
limit_offset = "0.005"

# 損切りの置き場所。auto = 市場が逆指値に対応していればブローカーに置く。
# 日本株は API 非対応なので auto でもエンジン合成になる。
stop_mode = "auto"

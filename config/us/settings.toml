# wbjp の設定 — 米国株用。**秘密はここに書かない。**
#
# 使い方:  uv run wbjp run --config-dir config/us
#          uv run wbjp data sync --config-dir config/us
#
# 日本株（config/）とは設定ディレクトリを分け、別プロセスで動かす。
# 1つの設定は1つの市場だけを扱う。認証情報（APIキー）は共通。
#
# 日本株との違い（詳細は src/wbjp/domain/market_rules.py）:
#   - 1株単位。単元株の丸めで見送りにならない
#   - 呼値は 0.01 ドル固定。制限値幅（ストップ高・安）は無い
#   - 逆指値（STOP_LOSS）をブローカーに置ける → 場中の急落に即応できる
#   - 差金決済の規制は無い
#   - 売買手数料は無料（2026-07-27〜）。SEC/FINRA 手数料のみ
#   - 金額はすべて **ドル建て**

[universe]
market = "US"

# 足データの取得元。
#   yfinance … 無料・非公式。日本株と同じ経路
#   webull   … Webull の市場データ API。ブローカーと同じ値。UAT で疎通確認が要る
data_provider = "yfinance"

# スクリーニング対象の銘柄リスト（1行1ティッカー）。config ディレクトリからの相対パス。
# symbols と合わせて allowlist になる。ここに無い銘柄には絶対に発注されない。
symbols_file = "universe.txt"
symbols = []

# --------------------------------------------------------------------------
# リスク上限（ドル建て）
# --------------------------------------------------------------------------
[risk]
kill_switch = false

max_order_value = "10000"      # 1注文あたりの上限（USD）。新規建てのみ。手仕舞い・逆指値には掛からない
max_orders_per_day = 20
max_daily_loss = "1000"        # 当日の損失がこれを超えたら新規建てを止める（USD）
max_position_weight = "0.25"
max_gross_exposure = "0.90"
max_preview_deviation = "0.02"

# --------------------------------------------------------------------------
# ポジションサイジング
# --------------------------------------------------------------------------
[sizing]
method = "atr_risk"
risk_per_trade = "0.01"
# 押し目買い型は「反転しなければ即撤退」が正しいので、日本株より少しタイトに
atr_stop_multiple = "1.5"
fixed_notional = "3000"
max_positions = 5

# --------------------------------------------------------------------------
# 損切り・利確の管理（ストップ価格はエンジンが持ち、米国株は逆指値として置く）
# --------------------------------------------------------------------------
[stops]
# 初期ストップ = 建値 − ATR × sizing.atr_stop_multiple（1R）
# +1R に達したらストップを建値に引き上げる（負けトレードをゼロにする）
breakeven_after_r = "1.0"
# 建値移動後は ATR トレーリング（2R 以降の伸びを取りにいく）
trailing = true
# 建ててから N 営業日で含み益ゼロ以下なら手仕舞い（押し目買いは早く効くのが本来）
stale_exit_days = 5
# 最大保有営業日数。短く回して資金効率と勝率を両立する
max_hold_days = 10

# --------------------------------------------------------------------------
# 発注の振る舞い
# --------------------------------------------------------------------------
[execution]
# 米国株の課税区分は Webull JP では GENERAL / SPECIFIC。NISA は成長投資枠で
# 米国株も対象だが、損切り前提のスイングには向かない。
tax_account_type = "SPECIFIC"
order_type = "limit"
limit_offset = "0.005"

# 損切りの置き場所。auto = 市場が対応していればブローカーに逆指値を置く。
# 米国株では実質 "broker"。日足判定に戻したいときだけ "engine" にする。
stop_mode = "auto"

# 時間外（プレ・アフター）取引。板が薄く滑りやすいので既定は無効。
extended_hours = false

# 米国株の戦略 — 勝率重視の押し目買い。
#
# trend_pullback が「スクリーニング＋順位付け」を兼ねる。条件を満たした
# 銘柄にスコア（direction 0.3〜1.0）を付け、サイジングが高い順に
# max_positions の枠を埋める。順位表は `wbjp screen --config-dir config/us`。
#
# combiner = "priority" は「重みが最大の戦略の意見をそのまま採る」。
# 押し目買いの順位を他の戦略に薄められないための選択。

combiner = "priority"
entry_threshold = 0.3
exit_threshold = 0.1

[[strategies]]
name = "trend_pullback"
enabled = true
weight = 10.0
sma_long = 200
sma_mid = 50
sma_short = 20
slope_lookback = 10
rs_lookback = 63                    # RS 比較の期間（約3ヶ月）
high_lookback = 60
max_drawdown_from_high = 0.15
breakout_lookback = 1               # 前日高値のブレイクをトリガーにする
volume_lookback = 20
volume_dryup_max = 0.7              # 押し目中の出来高が20日平均の70%以下
min_atr_ratio = 0.015
max_atr_ratio = 0.05
min_dollar_volume = 5_000_000.0     # 20日平均売買代金（USD）
benchmark = "SPY"                   # universe.txt に含めること
benchmark_sma = 50
blackout_file = "config/us/earnings.toml"
blackout_days_before = 3
exit_before_earnings = true

# 比較用。有効にしても priority 合成では trend_pullback が勝つ。
[[strategies]]
name = "sma_cross"
enabled = false
weight = 1.0
fast = 25
slow = 75

[[strategies]]
name = "rsi_reversion"
enabled = false
weight = 1.0

[[strategies]]
name = "atr_breakout"
enabled = false
weight = 1.5

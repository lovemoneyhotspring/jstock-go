# push / PR ごとに build・vet・test・staticcheck を回す。
# ローカルでは `make ci` が同じことをする（ローカルの test は本番機のメモリに合わせて -p 1。ここは並列のまま）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2 ./...
      - name: test
        run: go test -race -count=1 ./...
